<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>方案A · 暖纸质感</title>
<style>
:root{
  --bg:#f7f1e8; --card:#fdfbf6; --ink:#1d1a16; --muted:#6f665a; --line:#eadfd0; --line-strong:#e0cfba;
  --sage:#dfe6d6; --sage-ink:#35502f; --sage-bar:#5f7f55; --sage-deep:#c6d4bb;
  --hatch-a:#efebe5; --hatch-b:#f8f5f0; --hatch-line:#e3dccf;
  --brown:#b5733a; --amber-bg:#f6e7d3; --amber-ink:#8a5521;
  --blue:#dbe6f5; --blue-ink:#27508a; --blue-bar:#4f7cc0;
  --plum:#eadff2; --plum-ink:#593a78; --plum-bar:#8c63b3;
  --green:#d9ecd9; --green-ink:#2c6a3a; --green-bar:#4ea25e;
  --amber:#f7e6c4; --amber2-ink:#7d5a12; --amber-bar:#d39a2a;
  --slot:30px; --gutter:56px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:linear-gradient(180deg,#f3eadc 0%,#f9f5ee 40%,#f7f1e8 100%);min-height:100vh;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.tag{position:fixed;left:14px;bottom:10px;font-size:11px;color:var(--muted);background:#fffdf8cc;border:1px solid var(--line);padding:3px 9px;border-radius:99px;z-index:5}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
.cal{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 22px 16px;box-shadow:0 1px 0 #fff inset,0 18px 40px -24px #6b4b2a55}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.nav{width:38px;height:38px;border-radius:12px;border:1px solid var(--line-strong);background:#fffdf9;display:grid;place-items:center;font-size:18px;cursor:pointer}
.nav:hover{background:#f6efe3}
.range{display:flex;align-items:baseline;gap:8px}
.range small{font-size:12px;color:var(--brown);font-weight:600}
.range b{font-size:20px;letter-spacing:-.02em}
.sp{flex:1}
.pill{font-size:12px;padding:5px 11px;border-radius:99px;background:#e6ebe0;color:var(--sage-ink);display:inline-flex;align-items:center;gap:6px;font-weight:550}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--sage-bar)}
.pill.warn{background:var(--amber-bg);color:var(--amber-ink)}
.seg-view{display:inline-flex;padding:3px;background:#f3eadc;border-radius:12px}
.seg-view button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-size:13px;color:var(--muted);cursor:pointer}
.seg-view button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0001;font-weight:600}
.hdr,.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-left:var(--gutter)}
.hdr div{display:flex;align-items:center;gap:6px;padding:0 4px 6px;font-size:12px;color:var(--muted)}
.hdr b{font-size:17px;color:var(--ink);font-weight:650;min-width:26px;height:26px;display:inline-grid;place-items:center;border-radius:13px}
.hdr .today b{background:var(--brown);color:#fff;padding:0 7px}
.cityrow{margin-bottom:8px}
.cityrow div{padding:0 2px}
.city{display:inline-flex;align-items:center;gap:4px;max-width:100%;font-size:11.5px;color:#5a4e3f;background:#f1e7d8;border-radius:99px;padding:2px 8px}
.city svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.grid{position:relative}
.gutter{position:absolute;left:0;top:0;width:var(--gutter);height:100%}
.gutter span{position:absolute;right:12px;transform:translateY(-50%);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.col{position:relative;border-radius:16px;border:1px solid var(--line);overflow:hidden;
  background:
    repeating-linear-gradient(135deg,var(--hatch-a) 0 5px,var(--hatch-b) 5px 10px);}
.col.today{border-color:#d3a77c;box-shadow:0 0 0 1px #d3a77c55}
.col::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 calc(var(--slot)*2 - 1px),#e6dccd99 calc(var(--slot)*2 - 1px) calc(var(--slot)*2))}
.blk{position:absolute;left:4px;right:4px;border-radius:9px;overflow:hidden}
.blk.past{background:#faf7f1;opacity:.85}
.blk.free{background:var(--sage);border-left:3px solid var(--sage-bar);z-index:1}
.blk.free button{display:flex;align-items:center;width:100%;height:var(--slot);border:0;background:transparent;padding:0 8px;font-size:12px;color:var(--sage-ink);cursor:pointer;font-variant-numeric:tabular-nums;text-align:left}
.blk.free button span{opacity:0;font-weight:600}
.blk.free button:hover{background:#ffffff80}
.blk.free button:hover span,.blk.free button:focus-visible span{opacity:1}
.blk.free button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.blk.open{padding:5px 8px;font-size:12px;line-height:1.35;border-left:3px solid;z-index:1}
.blk.open b{display:block;font-weight:650}
.blk.open small{font-size:11px;opacity:.85}
.c-green{background:var(--green);color:var(--green-ink);border-color:var(--green-bar)}
.c-plum{background:var(--plum);color:var(--plum-ink);border-color:var(--plum-bar)}
.c-amber{background:var(--amber);color:var(--amber2-ink);border-color:var(--amber-bar)}
.c-blue{background:var(--blue);color:var(--blue-ink);border-color:var(--blue-bar)}
.blk.open.full{opacity:.6}
.selbox{position:absolute;left:3px;right:3px;border-radius:10px;background:var(--sage-deep);outline:2px solid var(--ink);outline-offset:-2px;z-index:3;pointer-events:none}
.selbox em{position:absolute;left:5px;top:5px;font-style:normal;font-size:11.5px;font-weight:650;background:var(--ink);color:#fff;padding:2px 7px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.now{position:absolute;left:0;right:0;border-top:1.5px dashed var(--brown);z-index:4;pointer-events:none}
.now em{position:absolute;left:0;top:0;transform:translateY(-50%);font-style:normal;font-size:11.5px;font-weight:650;color:#fff;background:var(--brown);padding:2px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0 0 var(--gutter);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:5px;border:1px solid var(--line-strong)}
.sw.h{background:repeating-linear-gradient(135deg,var(--hatch-a) 0 3px,var(--hatch-b) 3px 6px)}
.sw.f{background:var(--sage);border-color:var(--sage-bar)}
.sw.s{background:var(--ink);border-color:var(--ink)}
.sw.o{background:var(--plum);border-color:var(--plum-bar)}
.legend .r{margin-left:auto}
/* right panel */
.panel{position:sticky;top:20px}
.panel h1{font-size:26px;margin:6px 0 8px;letter-spacing:-.02em}
.panel p.lead{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.chosen{background:#e8ece0;border:1px solid #d9dfce;border-radius:22px;padding:14px 18px;margin-bottom:16px}
.chosen small{display:block;font-size:12px;font-weight:600;color:var(--sage-ink)}
.chosen strong{display:block;font-size:20px;margin:2px 0}
.chosen span{font-size:13px;color:var(--muted)}
.lbl{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.seg{display:flex;background:#f1e9de;border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 0;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 4px #0002}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input,textarea{width:100%;height:46px;border-radius:16px;border:1px solid var(--line-strong);background:#fcf8f1;padding:0 14px;font-size:14px}
textarea{height:auto;min-height:46px;padding:11px 14px;resize:vertical}
select:focus,input:focus,textarea:focus{outline:2px solid #1d1a16;outline-offset:1px}
.fields{display:grid;gap:10px;margin-top:12px}
.acts{display:flex;gap:10px;margin-top:16px}
.go{flex:1;height:52px;border:0;border-radius:99px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.cp{height:52px;padding:0 20px;border-radius:99px;border:1px solid var(--line-strong);background:#fffdf9;cursor:pointer}
.fine{font-size:12px;color:var(--muted);margin:12px 0 0}
.receipt{border-radius:22px;background:#e8ece0;padding:20px;margin-top:16px}
.receipt strong{display:block;font-size:17px;margin-bottom:4px}
@media (max-width:980px){
  .wrap{grid-template-columns:1fr;gap:20px;padding:14px 12px 70px}
  .panel{position:static}
  .cal{padding:14px 10px 12px;border-radius:22px}
}
@media (max-width:640px){
  :root{--gutter:34px}
  .hdr,.cols{gap:3px}
  .hdr div{flex-direction:column;gap:0;padding:0 0 4px;font-size:10.5px;align-items:center}
  .hdr b{font-size:14px;min-width:22px;height:22px}
  .cityrow div{text-align:center}
  .city{font-size:10px;padding:1px 5px}.city svg{display:none}
  .col{border-radius:10px}
  .blk{left:2px;right:2px}
  .blk.open{padding:2px 3px;font-size:10px}.blk.open small{display:none}
  .blk.free button{padding:0 3px}.blk.free button span{display:none}
  .gutter span{font-size:10px;right:5px}
  .head .pill.warn{display:none}.range b{font-size:16px}
  :root{--slot:28px}
  .selbox em{white-space:normal;font-size:9.5px;padding:1px 3px;line-height:1.2;right:3px}
  .legend{margin-left:0;gap:10px}
}
</style>
</head>
<body>
<span class="tag">方案 A · 暖纸质感 — 视觉原型，示例数据</span>
<div class="wrap">
  <section class="cal" aria-label="预约日历">
    <div class="head">
      <button class="nav" aria-label="上一周">←</button>
      <div class="range"><small>本周</small><b>2026 年 11 月 23 – 29 日</b></div>
      <button class="nav" aria-label="下一周">→</button>
      <span class="sp"></span>
      <span class="pill"><i></i>实时</span>
      <span class="pill warn">忙闲约 3 分钟前同步</span>
    </div>
    <div class="hdr" id="hdr"></div>
    <div class="hdr cityrow" id="city"></div>
    <div class="grid" id="grid"><div class="gutter" id="gutter"></div><div class="cols" id="cols"></div></div>
    <div class="legend">
      <span><i class="sw h"></i>占用</span><span><i class="sw f"></i>可约</span><span><i class="sw o"></i>开放局</span><span><i class="sw s"></i>已选</span>
      <span class="r">时间为北京时间 UTC+8</span>
    </div>
  </section>

  <aside class="panel" aria-label="预约">
    <h1>预约时间</h1>
    <p class="lead">点击日历中的绿色时段即可选定开始时间，也可以在下方选择。邀请人会邮件确认；占用时段的细节保持私密。</p>
    <div id="form">
      <div class="chosen"><small>已选时段</small><strong id="c-day">—</strong><span id="c-time">—</span></div>
      <span class="lbl">时长</span>
      <div class="seg" id="dur"></div>
      <div class="two">
        <div><span class="lbl">日期</span><select id="sd"></select></div>
        <div><span class="lbl">开始时间</span><select id="st"></select></div>
      </div>
      <div class="fields">
        <input id="nm" placeholder="您的姓名" autocomplete="off">
        <input id="em" placeholder="回复邮箱" autocomplete="off" inputmode="email">
        <textarea id="nt" rows="1" placeholder="想聊什么？（可选）"></textarea>
      </div>
      <div class="acts"><button class="go" id="go">提交申请 <span aria-hidden="true">↗</span></button><button class="cp" id="cp">复制</button></div>
      <p class="fine">这只是预约请求，不会直接占用日程，以邀请人的回复确认为准。邮件没弹出？点「复制」，把整段内容发给对方即可。</p>
    </div>
  </aside>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const fmt=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const H0=540,H1=1260,STEP=30,NOW={d:0,m:660};
const WD=['周一','周二','周三','周四','周五','周六','周日'],DATE=[23,24,25,26,27,28,29];
const CITY=['深圳','深圳','深圳','香港','香港','北京','北京'];
const BUSY=[[[780,870],[960,1020]],[[600,720],[1020,1110]],[[540,660],[900,1020]],[[570,720],[840,960]],[[600,720],[810,900]],[],[]];
const OPEN=[{d:2,s:720,e:780,t:'Lunch',c:'green',n:'剩 1 席'},{d:3,s:1140,e:1260,t:'Dinner',c:'plum',n:'剩 3 席'},{d:5,s:600,e:660,t:'Coffee chat',c:'amber',n:'剩 2 席'},{d:6,s:900,e:960,t:'Airport chat',c:'blue',n:'已满'}];
const openAt=(d,m)=>OPEN.find(o=>o.d===d&&m>=o.s&&m<o.e)||null;
const stateAt=(d,m)=>d<NOW.d||(d===NOW.d&&m<NOW.m)?'past':openAt(d,m)?'open':BUSY[d].some(([s,e])=>m>=s&&m<e)?'busy':d>=5?'closed':'free';
function blocks(d){const out=[];for(let m=H0;m<H1;m+=STEP){const s=stateAt(d,m),o=s==='open'?openAt(d,m):null,l=out[out.length-1];
  if(l&&l.s===s&&l.o===o)l.e=m+STEP;else out.push({s,o,st:m,e:m+STEP});}return out;}
const sel={d:1,s:840,dur:60},DURS=[30,60,90,120];
const fits=(d,s,dur)=>{if(s+dur>H1)return false;for(let m=s;m<s+dur;m+=STEP)if(stateAt(d,m)!=='free')return false;return true;};
function pick(d,m){sel.d=d;sel.s=m;if(!fits(d,m,sel.dur))sel.dur=[...DURS].reverse().find(x=>fits(d,m,x))||30;refresh();}
const slotPx=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot'));
const yOf=m=>(m-H0)/STEP*slotPx();

function build(){
  const px=slotPx(),h=(H1-H0)/STEP*px;
  $('#hdr').innerHTML=WD.map((w,i)=>`<div class="${i===NOW.d?'today':''}"><span>${w}</span><b>${DATE[i]}</b></div>`).join('');
  $('#city').innerHTML=CITY.map(c=>`<div><span class="city"><svg viewBox="0 0 16 16"><path d="M8 14s4.5-4.2 4.5-7.5a4.5 4.5 0 1 0-9 0C3.5 9.800 8 14 8 14Z"/><circle cx="8" cy="6.5" r="1.600"/></svg>${c}</span></div>`).join('');
  $('#grid').style.height=h+'px';
  $('#gutter').innerHTML=''; for(let m=H0;m<=H1;m+=60){const s=el('span',null,fmt(m));s.style.top=yOf(m)+'px';$('#gutter').append(s);}
  const cols=$('#cols');cols.innerHTML='';cols.style.height=h+'px';
  for(let d=0;d<7;d++){
    const col=el('div','col'+(d===NOW.d?' today':''));
    for(const b of blocks(d)){
      if(!['past','free','open'].includes(b.s))continue;
      const e=el('div','blk '+b.s);e.style.top=yOf(b.st)+'px';e.style.height=yOf(b.e)-yOf(b.st)-1+'px';
      if(b.s==='free'){for(let m=b.st;m<b.e;m+=STEP){const bt=el('button',null,`<span>${fmt(m)}</span>`);bt.title=`${WD[d]} ${fmt(m)}`;bt.onclick=()=>pick(d,m);e.append(bt);}}
      if(b.s==='open'){e.classList.add('c-'+b.o.c);if(b.o.n==='已满')e.classList.add('full');e.innerHTML=`<b>${b.o.t}</b><small>${fmt(b.o.s)}–${fmt(b.o.e)} · ${b.o.n}</small>`;}
      col.append(e);
    }
    if(sel.d===d){const s=el('div','selbox',`<em>${fmt(sel.s)}–${fmt(sel.s+sel.dur)}</em>`);s.style.top=yOf(sel.s)+'px';s.style.height=yOf(sel.s+sel.dur)-yOf(sel.s)-1+'px';col.append(s);}
    cols.append(col);
  }
  const now=el('div','now',`<em>${fmt(NOW.m)}</em>`);now.style.top=yOf(NOW.m)+'px';$('#grid').append(now);
}
function panel(){
  $('#c-day').textContent=`${WD[sel.d]} · 11 月 ${DATE[sel.d]} 日`;
  $('#c-time').textContent=`${fmt(sel.s)} – ${fmt(sel.s+sel.dur)} · 北京时间`;
  $('#dur').innerHTML='';
  for(const x of DURS){const b=el('button',null,`${x} 分钟`);b.setAttribute('aria-pressed',x===sel.dur);b.disabled=!fits(sel.d,sel.s,x);b.onclick=()=>{sel.dur=x;refresh();};$('#dur').append(b);}
  $('#sd').innerHTML='';for(let d=NOW.d;d<5;d++){if(![...Array(24).keys()].some(i=>fits(d,H0+i*STEP,30)))continue;const o=el('option',null,`${WD[d]} · 11 月 ${DATE[d]} 日`);o.value=d;o.selected=d===sel.d;$('#sd').append(o);}
  $('#st').innerHTML='';for(let m=H0;m<H1;m+=STEP){if(!fits(sel.d,m,sel.dur))continue;const o=el('option',null,`${fmt(m)} – ${fmt(m+sel.dur)}`);o.value=m;o.selected=m===sel.s;$('#st').append(o);}
}
function refresh(){build();panel();}
$('#sd').onchange=e=>{const d=+e.target.value,m=[...Array(24).keys()].map(i=>H0+i*STEP).find(m=>fits(d,m,sel.dur)||fits(d,m,30));pick(d,m);};
$('#st').onchange=e=>pick(sel.d,+e.target.value);
$('#cp').onclick=()=>{navigator.clipboard?.writeText(`预约申请：${WD[sel.d]} 11 月 ${DATE[sel.d]} 日 ${fmt(sel.s)}–${fmt(sel.s+sel.dur)}（北京时间）`);$('#cp').textContent='已复制';setTimeout(()=>$('#cp').textContent='复制',1400);};
$('#go').onclick=()=>{$('#form').innerHTML=`<div class="receipt" role="status"><strong>已收到申请，等待确认</strong>${WD[sel.d]} 11 月 ${DATE[sel.d]} 日 ${fmt(sel.s)}–${fmt(sel.s+sel.dur)}（北京时间）<p class="fine">邀请人确认后会邮件通知你。这是示例原型，没有真正提交。</p></div>`;};
addEventListener('resize',()=>refresh());
refresh();
</script>
</body>
</html>
