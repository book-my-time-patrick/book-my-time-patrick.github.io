services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: '3000'
      TRUST_PROXY: '1'
      FRONTEND_ORIGIN: https://${SITE_DOMAIN:?请在.env中设置SITE_DOMAIN}
      SITE_ORIGIN: https://${SITE_DOMAIN:?请在.env中设置SITE_DOMAIN}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?请配置服务端加密密钥}
      SETUP_TOKEN_HASH: ${SETUP_TOKEN_HASH:-}
      SETUP_EXPIRES_AT: ${SETUP_EXPIRES_AT:-}
    volumes:
      - app_data:/app/data
    expose: ['3000']
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在.env中设置SITE_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_data:
  caddy_data:
  caddy_config:
