services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: '3000'
      FRONTEND_ORIGIN: https://${SITE_DOMAIN:?请在.env中设置SITE_DOMAIN}
    expose: ['3000']
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在.env中设置SITE_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
